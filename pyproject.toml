[project]
name = "MedHB"
version = "0.1.0"
description = "Medical Harness Benchmark for real-world medical diagnosis and decision-making."
readme = "README.md"
authors = [
    { name = "Moenupa", email = "49304833+Moenupa@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "typer",
    "fastmcp>=4.0,<4.1",
    "pillow>=11,<13",
]

[project.scripts]
medhb = "medhb.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-xdist",
    "pytest-cov"
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--import-mode=importlib"
markers = [
    "slow: mark tests as slow (pytest -m 'not slow' or set RUN_SLOW=1 to run)",
]
